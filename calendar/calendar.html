<html>
    <head>
        <meta charset="UTF-8">
        <title>점검 목록 달력 표시</title>
    </head>
    <body>
        <h2>점검 목록 달력 표시</h2>
        <p>'점검 내역 작성'단계에서 작성한 점검 내역은 즉각 반영되어 최근 순서대로 화면에 표시됩니다.
        주 화면 하단의 '달력' 버튼을 클릭하면 달력 표시로 변환됩니다.
        달력의 특정 날짜를 클릭하면 해당 날짜의 점검 목록이 표시됩니다. 생성시각의 역순서로 표시됩니다.
        원래의 목록 화면으로의 변경은 '목록' 버튼을 클릭합니다. </p>
        <img width=250 height=512 src="calendar view.png" alt="image of calendar view">
        <img width=250 height=512 src="list view.png" alt="image of list view">
    </body>
</html>
