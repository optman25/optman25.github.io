<html>
    <head>
        <meta charset="UTF-8">
        <title>달력 표시</title>
    </head>
    <body>
        <h2>달력 표시</h2>
        <p>메인 페이지(홈 페이지) 화면에서 표시되는 점검 목록을 달력 형태로 표시합니다.</p>
        <ul>
            <li>메인 페이지의 우하단의 달력 버튼을 클릭하면 달력 형태로 표시됩니다.</li>
            <img width=250 height=512 src="list view.png" alt="image of calendar view">
            <li>점검 날짜별로 항목을 정리하여 표시합니다.</li>
            <p>원하는 날짜를 클릭하면 해당 날짜에 작성된 점검 내역이 표시됩니다.
                다수의 점검 내역이 있는 경우, 아래로 스크롤하면 해당 날짜에 작성된 점검 내역을 확인할 수 있습니다.</p>
            <img width=250 height=512 src="calendar view 1.png" alt="image of calendar view 1">
            <img width=250 height=512 src="calendar view 2.png" alt="image of calendar view 2">
            <img width=250 height=512 src="calendar view 3.png" alt="image of calendar view 3">
            <img width=250 height=512 src="calendar view 4.png" alt="image of calendar view 4">
        </ul>
    </body>
</html>
